[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-ifood-loja"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.5,<1"]
browser = ["playwright>=1.45"]

[tool.ruff.lint]
ignore = ["BLE001", "B008", "TRY004"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["N999"]
"ifood/__init__.py" = ["N999"]
"dashboard/plugin_api.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["ifood*"]
